plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.descargador.videos'
    compileSdk 34

    defaultConfig {
        applicationId "com.descargador.videos"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1"

        python {
            version = "3.11"
            pip {
                install "yt-dlp"
            }
        }

        // Chaquopy: solo ABIs de dispositivos reales. x86_64 es unicamente para
        // emulador y agrega ~12 MB sin utilidad en un APK distribuido directo.
        ndk {
            abiFilters += ["armeabi-v7a", "arm64-v8a"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
