plugins {
    id 'com.android.application'
    id 'com.chaquo.python' version '15.0.0'
}

android {
    namespace 'com.descargador.videos'
    compileSdk 34

    defaultConfig {
        applicationId "com.descargador.videos"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    python {
        buildPython "C:\\Python314\\python.exe"
        buildPythonVersion "3.14"
        pip {
            install "yt-dlp"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.chaquo.python:gradle:15.0.0'
}
